name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o ShinobiLauncher-Android-Project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: ShinobiLauncher
      - uses: actions/upload-artifact@v4
        with:
          name: shinobi-launcher-apk
          path: ShinobiLauncher/app/build/outputs/apk/debug/app-debug.apk
